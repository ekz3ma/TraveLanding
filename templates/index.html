<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>Кавказ · Горы вдохновения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0f14;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Основной контейнер — обрезает всё, что выходит за пределы экрана */
    .travel-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #04070a;
    }

    /*
      ВАЖНОЕ ИСПРАВЛЕНИЕ:
      Контейнер слайдов теперь имеет height: 100vh * количество слайдов,
      и каждый слайд занимает ровно 100vh.
      При translateY вниз — показываем следующий.
    */
    .slides-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      /* Высота будет задана через JS как 100vh * N */
      transition: transform 0.9s cubic-bezier(0.23, 0.38, 0.16, 0.98);
      will-change: transform;
    }

    .slide {
      position: relative;
      width: 100%;
      height: 100vh; /* Каждый слайд — ровно один экран */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Изображения */
    .slide img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: brightness(0.75) contrast(1.1);
      transition: filter 0.4s ease, transform 1.2s cubic-bezier(0.2, 0.5, 0.3, 1);
      transform: scale(1.02);
    }

    .slide.active img {
      transform: scale(1);
      filter: brightness(0.8) contrast(1.15);
    }

    /* Тёмный градиент */
    .slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 10, 18, 0.35) 0%, rgba(2, 8, 15, 0.5) 45%, rgba(0, 0, 0, 0.7) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Текстовый слой */
    .slide-content {
      position: relative;
      z-index: 5;
      text-align: center;
      max-width: 850px;
      padding: 0 2rem;
      margin-top: -2rem;
    }

    .slide.active .slide-content {
      animation: fadeInUp 0.9s cubic-bezier(0.15, 0.85, 0.3, 1.05) both;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(35px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .location-tag {
      display: inline-block;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 40px;
      padding: 0.5rem 1.7rem;
      margin-bottom: 1.8rem;
      color: #f0e9db;
    }

    .slide-title {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1.2rem;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .slide-description {
      font-size: 1.15rem;
      font-weight: 400;
      max-width: 550px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      line-height: 1.6;
      backdrop-filter: blur(3px);
    }

    /* Счётчик внизу */
    .counter-panel {
      position: absolute;
      bottom: 2.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(10, 15, 22, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 60px;
      padding: 0.5rem 1.8rem;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .current-number {
      font-size: 1.8rem;
      font-weight: 600;
      color: white;
      line-height: 1;
    }

    .separator {
      font-size: 1.4rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0.2rem;
    }

    .total-number {
      font-size: 1.4rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1;
    }

    /* Подсказка прокрутки */
    .scroll-hint {
      position: absolute;
      bottom: 6.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .mouse-icon {
      width: 20px;
      height: 30px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }

    .wheel {
      width: 3px;
      height: 8px;
      background: white;
      border-radius: 4px;
      animation: scrollWheel 1.8s infinite;
    }

    @keyframes scrollWheel {
      0% { opacity: 1; transform: translateY(0); }
      50% { opacity: 0.5; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Точки навигации */
    .nav-dots {
      position: absolute;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      transition: all 0.4s ease;
      cursor: pointer;
      border: 1px solid transparent;
      backdrop-filter: blur(4px);
    }

    .dot.active {
      background: white;
      transform: scale(1.7);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.9);
    }

    @media (max-width: 700px) {
      .slide-content {
        padding: 0 1.5rem;
      }
      .counter-panel {
        bottom: 2rem;
        padding: 0.4rem 1.4rem;
      }
      .nav-dots {
        right: 1rem;
      }
      .scroll-hint {
        bottom: 5.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="travel-hero" id="heroContainer">
    <!-- Контейнер со слайдами -->
    <div class="slides-container" id="slidesContainer">
      <!-- Слайды генерируются через JavaScript -->
    </div>

    <!-- Счётчик -->
    <div class="counter-panel" id="counterPanel">
      <span class="current-number" id="currentSlide">1</span>
      <span class="separator">/</span>
      <span class="total-number" id="totalSlides">10</span>
    </div>

    <!-- Подсказка -->
    <div class="scroll-hint" id="scrollHint">
      <div class="mouse-icon">
        <div class="wheel"></div>
      </div>
      <span>скролл</span>
    </div>

    <!-- Точки -->
    <div class="nav-dots" id="navDots"></div>
  </div>

  <script>
    (function () {
      // Даные о локациях Кавказа
      const slidesData = [
        {
          location: "Эльбрус · Кабардино-Балкария",
          title: "Вершина Европы",
          description: "Дыханье ледников и белоснежные склоны. Самая высокая точка России и место силы.",
          image: "https://wikiway.com/upload/resize_cache/iblock/2bb/720_400_2/Elbrus.jpg?q=80&w=1974&auto=format&fit=crop"
        },
        {
          location: "Домбай · Карачаево-Черкесия",
          title: "Сердце гор",
          description: "Изумрудные долины, хвойные леса и величественные пики. Приют вдохновения.",
          image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop"
        },
        {
          location: "Чегемские водопады",
          title: "Плачущие скалы",
          description: "Каскады воды, срывающиеся с отвесных скал. Завораживающая стихия.",
          image: "https://images.unsplash.com/photo-1472396961693-142e6e269027?q=80&w=2152&auto=format&fit=crop"
        },
        {
          location: "Архыз · Софийские озёра",
          title: "Зеркала небес",
          description: "Бирюзовая гладь среди заснеженных хребтов. Тишина, которую слышишь сердцем.",
          image: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070&auto=format&fit=crop"
        },
        {
          location: "Ингушетия · Эрзи",
          title: "Башенный край",
          description: "Древние сторожевые башни на фоне скалистых гор. История, высеченная в камне.",
          image: "https://travelrussia.ru/upload/iblock/111/s4xuxic52def4h09sj544tc1draclgk7.jpg"
        },
        {
          location: "Дагестан · Сулакский каньон",
          title: "Глубина впечатлений",
          description: "Один из глубочайших каньонов мира. Бирюзовая река Сулак и головокружительные обрывы.",
          image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop"
        },
        {
          location: "Северная Осетия · Цей",
          title: "Ледниковая сказка",
          description: "Цейское ущелье — край снежных пиков и бурных рек. Идеальный пейзаж для души.",
          image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop"
        },
        {
          location: "Казбек · Грузия/Россия",
          title: "Исполин Кавказа",
          description: "Одинокий гигант с ледяной короной. Легенды и облака у его подножия.",
          image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2070&auto=format&fit=crop"
        },
        {
          location: "Лаго-Наки · Адыгея",
          title: "Плато диких цветов",
          description: "Альпийские луга, пещеры и панорамы, от которых захватывает дух.",
          image: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=2070&auto=format&fit=crop"
        },
        {
          location: "Теберда · Домбайская поляна",
          title: "Заповедный рассвет",
          description: "Ущелья, где туман обнимает сосны. Край первозданной природы и горного воздуха.",
          image: "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=1974&auto=format&fit=crop"
        }
      ];

      const slidesContainer = document.getElementById('slidesContainer');
      const currentSlideSpan = document.getElementById('currentSlide');
      const totalSlidesSpan = document.getElementById('totalSlides');
      const navDotsContainer = document.getElementById('navDots');
      const scrollHint = document.getElementById('scrollHint');

      const totalSlides = slidesData.length;
      totalSlidesSpan.textContent = totalSlides;

      let currentIndex = 0;
      let isTransitioning = false;

      // ===== ПОСТРОЕНИЕ СЛАЙДОВ =====
      function buildSlides() {
        slidesContainer.innerHTML = '';
        navDotsContainer.innerHTML = '';

        slidesData.forEach((slide, index) => {
          // Слайд
          const slideDiv = document.createElement('div');
          slideDiv.className = 'slide';
          if (index === 0) slideDiv.classList.add('active');
          slideDiv.setAttribute('data-index', index);

          const img = document.createElement('img');
          img.src = slide.image;
          img.alt = slide.location;
          img.loading = index === 0 ? 'eager' : 'lazy';

          const contentDiv = document.createElement('div');
          contentDiv.className = 'slide-content';
          contentDiv.innerHTML = `
            <div class="location-tag">${slide.location}</div>
            <h1 class="slide-title">${slide.title}</h1>
            <p class="slide-description">${slide.description}</p>
          `;

          slideDiv.appendChild(img);
          slideDiv.appendChild(contentDiv);
          slidesContainer.appendChild(slideDiv);

          // Точка
          const dot = document.createElement('div');
          dot.className = 'dot';
          if (index === 0) dot.classList.add('active');
          dot.setAttribute('data-index', index);
          dot.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.getAttribute('data-index'), 10);
            if (idx !== currentIndex && !isTransitioning) {
              goToSlide(idx);
            }
          });
          navDotsContainer.appendChild(dot);
        });

        // Задаём высоту контейнера = количество слайдов × 100vh
        slidesContainer.style.height = `${totalSlides * 100}vh`;
        // Начальная позиция
        slidesContainer.style.transform = `translateY(0)`;
      }

      // ===== УСТАНОВКА АКТИВНОГО СЛАЙДА =====
      function setActiveSlide(index) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        const activeSlide = document.querySelector(`.slide[data-index="${index}"]`);
        if (activeSlide) activeSlide.classList.add('active');

        document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        const activeDot = document.querySelector(`.dot[data-index="${index}"]`);
        if (activeDot) activeDot.classList.add('active');

        currentSlideSpan.textContent = index + 1;
      }

      // ===== ПЕРЕХОД =====
      function goToSlide(newIndex) {
        if (newIndex === currentIndex || isTransitioning) return;
        if (newIndex < 0 || newIndex >= totalSlides) return;

        isTransitioning = true;

        // Скрываем подсказку
        if (scrollHint.style.opacity !== '0') {
          scrollHint.style.transition = 'opacity 0.4s';
          scrollHint.style.opacity = '0';
        }

        setActiveSlide(newIndex);

        // Двигаем контейнер вверх на (newIndex * 100vh)
        slidesContainer.style.transform = `translateY(-${newIndex * 100}vh)`;

        currentIndex = newIndex;

        setTimeout(() => {
          isTransitioning = false;
        }, 900);
      }

      // ===== КОЛЕСО МЫШИ =====
      function handleWheel(e) {
        e.preventDefault();
        if (isTransitioning) return;

        if (e.deltaY > 0) {
          if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
        } else {
          if (currentIndex > 0) goToSlide(currentIndex - 1);
        }
      }

      // ===== СВАЙПЫ НА ТЕЛЕФОНЕ =====
      let touchStartY = 0;
      function handleTouchStart(e) {
        if (isTransitioning) return;
        touchStartY = e.changedTouches[0].screenY;
      }
      function handleTouchEnd(e) {
        if (isTransitioning) return;
        const diff = touchStartY - e.changedTouches[0].screenY;
        if (Math.abs(diff) > 50) {
          if (diff > 0 && currentIndex < totalSlides - 1) {
            goToSlide(currentIndex + 1);
          } else if (diff < 0 && currentIndex > 0) {
            goToSlide(currentIndex - 1);
          }
        }
      }

      // ===== КЛАВИАТУРА =====
      function handleKeyDown(e) {
        if (isTransitioning) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (currentIndex > 0) goToSlide(currentIndex - 1);
        }
      }

      // ===== ИНИЦИАЛИЗАЦИЯ =====
      function init() {
        buildSlides();
        window.addEventListener('wheel', handleWheel, { passive: false });
        window.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchend', handleTouchEnd, { passive: true });
        window.addEventListener('keydown', handleKeyDown);

        setTimeout(() => {
          if (scrollHint.style.opacity !== '0' && currentIndex === 0) {
            scrollHint.style.transition = 'opacity 0.5s';
            scrollHint.style.opacity = '0.2';
          }
        }, 5000);
      }

      init();

      window.addEventListener('beforeunload', () => {
        window.removeEventListener('wheel', handleWheel);
        window.removeEventListener('touchstart', handleTouchStart);
        window.removeEventListener('touchend', handleTouchEnd);
        window.removeEventListener('keydown', handleKeyDown);
      });
    })();
  </script>
</body>
</html>
